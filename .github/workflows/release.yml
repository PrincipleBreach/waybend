name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            platform: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            platform: linux
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            platform: macos
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            platform: macos
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            platform: windows
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke-test Unix binary
        if: matrix.archive == 'tar.gz'
        run: target/${{ matrix.target }}/release/waybend version
      - name: Smoke-test Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: target/${{ matrix.target }}/release/waybend.exe version
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/waybend README.md LICENSE waybend.example.yml staging/
          tar -C staging -czf waybend-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging
          Copy-Item target/${{ matrix.target }}/release/waybend.exe,README.md,LICENSE,waybend.example.yml staging/
          Compress-Archive staging/* waybend-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: anchore/sbom-action@v0
        with:
          path: staging
          format: spdx-json
          output-file: waybend-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign artifacts with GitHub OIDC
        shell: bash
        run: |
          for artifact in waybend-${{ github.ref_name }}-${{ matrix.target }}.*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: waybend-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: waybend-${{ matrix.target }}
          path: waybend-${{ github.ref_name }}-${{ matrix.target }}.*

  container:
    name: Multi-platform container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/principlebreach/waybend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign container with GitHub OIDC
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/principlebreach/waybend
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish:
    name: Publish GitHub release
    needs: [binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum waybend-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waybend
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: PrincipleBreach/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Render formula
        run: waybend/.github/scripts/render-homebrew-formula.sh "${GITHUB_REF_NAME}" dist homebrew-tap/Formula/waybend.rb
      - name: Validate formula syntax
        run: ruby -c homebrew-tap/Formula/waybend.rb
      - name: Publish formula
        working-directory: homebrew-tap
        run: |
          git config user.name "Principle Breach Release"
          git config user.email "kr1shna4garwal@gmail.com"
          git add Formula/waybend.rb
          git diff --cached --quiet && exit 0
          git commit -m "waybend ${GITHUB_REF_NAME}"
          git push
