[package]
name = "waybend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Self-hosted SSRF redirect and payload workbench"
repository = "https://github.com/PrincipleBreach/waybend"
homepage = "https://principlebreach.com"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hickory-proto = "0.26.1"
http = "1.3"
ipnet = { version = "2.11", features = ["serde"] }
lru = "0.18.2"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.3", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
http-body-util = "0.1"
predicates = "3.1"
tempfile = "3.21"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
